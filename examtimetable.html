<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End Semester Exam Timetable</title>
    


    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-light: #112240;
            --accent: #64ffda;
            --text-main: #2d3748;
            --text-light: #718096;
            --bg-gradient-start: #ffffff;
            --bg-gradient-end: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            color: var(--text-main);
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(10, 25, 47, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10, 25, 47, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        /* --- NAVBAR --- */
        nav {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .logo i {
            color: var(--accent);
            text-shadow: 0 0 5px rgba(100, 255, 218, 0.5);
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            font-weight: 600;
            color: var(--primary-dark);
            position: relative;
            transition: color 0.3s;
            text-decoration: none;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        /* --- MAIN CONTAINER --- */
        .container {
            max-width: 1000px;
            margin: 100px auto;
            padding: 0 5%;
        }

        .page-title {
            text-align: center;
            font-size: 2.5rem;
            color: var(--primary-dark);
            margin-bottom: 1rem;
        }

        .page-subtitle {
            text-align: center;
            color: var(--text-light);
            font-size: 1.1rem;
            margin-bottom: 3rem;
        }

        /* --- TIMETABLE STYLES --- */
        .timetable-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        table thead {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
            color: #ffffff;
        }

        table th {
            padding: 1.2rem;
            text-align: left;
            font-weight: 700;
            font-size: 1rem;
        }

        table td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
        }

        table tbody tr {
            transition: all 0.3s ease;
        }

        table tbody tr:hover {
            background: rgba(100, 255, 218, 0.1);
            transform: scale(1.01);
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        .subject-name {
            font-weight: 600;
            color: var(--primary-dark);
        }

        .exam-date {
            color: var(--accent);
            font-weight: 600;
        }

        .exam-time {
            color: var(--text-main);
        }

        .exam-hall {
            background: rgba(100, 255, 218, 0.15);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
            color: var(--primary-dark);
        }

        /* --- INFO BOX --- */
        .info-box {
            background: rgba(100, 255, 218, 0.1);
            border-left: 4px solid var(--accent);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .info-box h3 {
            color: var(--primary-dark);
            margin-bottom: 0.5rem;
        }

        .info-box p {
            color: var(--text-light);
            line-height: 1.6;
        }

        .info-box ul {
            margin-left: 1.5rem;
            margin-top: 1rem;
        }

        .info-box li {
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        /* --- BUTTONS --- */
        .btn {
            display: inline-block;
            background: var(--primary-dark);
            color: #ffffff;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
            text-decoration: none;
            border: none;
            cursor: pointer;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, var(--primary-dark), var(--accent));
            z-index: -1;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:hover {
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.4);
        }

        .btn-back {
            margin-top: 2rem;
            text-align: center;
        }

        /* --- FOOTER --- */
        footer {
            background: var(--primary-dark);
            color: #ffffff;
            text-align: center;
            padding: 2rem 5%;
            margin-top: 4rem;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            .container {
                margin-top: 80px;
            }
            .page-title {
                font-size: 1.8rem;
            }
            table {
                font-size: 0.9rem;
            }
            table th, table td {
                padding: 0.8rem;
            }
        }
    </style>
</head>
